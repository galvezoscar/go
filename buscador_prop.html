<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gia| Buscador de compras</title>
<style>
:root{--bg:#080b18;--panel:#111a2d;--cyan:#35e7ff;--purple:#a879ff;--muted:#aab3ca}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#17234a,transparent 38%),radial-gradient(ellipse at 90% 10%,#281342,transparent 32%),var(--bg);color:#f5f7ff;font-family:Arial,sans-serif}
header{padding:26px 5vw 20px;border-bottom:1px solid #ffffff18;background:#080b18cc}.brand{font-size:clamp(25px,4vw,42px);font-weight:900}.brand span{color:var(--cyan);text-shadow:0 0 18px #35e7ff88}header p{color:var(--muted)}
.search{display:flex;gap:10px;max-width:900px}input,select{background:#0b1020;color:white;border:1px solid #34415f;border-radius:12px;padding:14px;font-size:16px}#q{flex:1;min-width:0}
.hero{margin:25px 5vw 30px;min-height:230px;border:1px solid #4c5b83;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(110deg,#121c38,#21133d 60%,#0b2635);box-shadow:0 15px 50px #0008}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42}.hero div{position:relative;padding:34px;max-width:720px}.eyebrow{color:var(--cyan);font-weight:bold;letter-spacing:2px;text-transform:uppercase;font-size:12px}.hero h1{font-size:clamp(27px,5vw,48px);margin:10px 0}.hero p{color:#d6def4}
main{padding:0 5vw 50px}.section{margin:30px 0 38px}.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.head h2{font-size:clamp(20px,3vw,27px);margin:0;flex:1}.head h2:before{content:"";display:inline-block;width:5px;height:23px;border-radius:5px;background:var(--cyan);margin-right:11px;vertical-align:-4px;box-shadow:0 0 12px var(--cyan)}.head small{color:var(--muted)}.nav{display:flex;gap:7px}.nav button{background:#111a2d;color:white;border:1px solid #34415f;border-radius:9px;padding:7px 12px;cursor:pointer}
.rail{display:flex;gap:15px;overflow-x:auto;scroll-behavior:smooth;padding:4px 2px 15px;scrollbar-color:#45557c transparent}.card{flex:0 0 220px;background:linear-gradient(160deg,#151e34,#0c1120);border:1px solid #293754;border-radius:16px;overflow:hidden;box-shadow:0 8px 22px #0005;transition:.2s}.card:hover{transform:translateY(-5px);border-color:var(--cyan);box-shadow:0 10px 30px #35e7ff22}.card img{width:100%;height:145px;object-fit:cover;display:block;background:#1a2237}.body{padding:13px}.tag{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:1px}.card h3{font-size:16px;margin:7px 0}.card p{font-size:13px;color:var(--muted);line-height:1.4;min-height:36px}.actions{display:flex;gap:8px}.actions a{flex:1;text-align:center;text-decoration:none;padding:9px;border-radius:9px;font-size:12px;font-weight:bold;color:#07101b;background:linear-gradient(90deg,var(--cyan),#8cddff)}.actions a.alt{background:#252f49;color:#e9efff;border:1px solid #3a496a}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #42506d;border-radius:15px}footer{text-align:center;color:#75809c;padding:25px;border-top:1px solid #ffffff12;font-size:12px}
@media(max-width:600px){header{padding:22px 4vw}.search{flex-direction:column}.hero{margin:18px 4vw 25px;min-height:210px}.hero div{padding:24px 20px}main{padding:0 4vw 40px}.card{flex-basis:180px}.card img{height:125px}}
</style></head><body>
<header><div class="brand">GÁLVEZ <span>OSCAR</span> | PROPAGANDAS</div><p>Encontrá anuncios, productos y recomendaciones en un solo lugar.</p>
<div class="search"><input id="q" type="search" placeholder="Buscar productos, marcas o palabras clave..."><select id="cat"><option value="">Todos los rubros</option></select></div></header>
<section class="hero" id="hero"><div><div class="eyebrow">Espacio destacado</div><h1>Todo lo que buscás, en un solo lugar</h1><p>Promociones, comercios y productos organizados por rubro.</p></div></section>
<main id="content"><div class="empty">Cargando propagandas…</div></main><footer>Gálvez Oscar · Buscador maestro de propagandas</footer>
<script>
const SOURCE='propagandas.html',WA_PHONE=''; // Opcional: número con código de país, sin + ni espacios.
const $=s=>document.querySelector(s);let ads=[];
const fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360"><rect width="100%" height="100%" fill="#18223a"/><text x="50%" y="50%" fill="#aab3ca" font-size="25" text-anchor="middle">Imagen no disponible</text></svg>');
function parse(doc){return [...doc.querySelectorAll('.ad-item')].map((e,i)=>({title:e.dataset.title||e.querySelector('.ad-title')?.textContent.trim()||'Anuncio',category:e.dataset.category||'Otros',keywords:e.dataset.keywords||'',description:e.dataset.description||e.querySelector('.ad-description')?.textContent.trim()||'',image:e.dataset.image||e.querySelector('img')?.getAttribute('src')||'',link:e.dataset.link||e.querySelector('.ad-link')?.getAttribute('href')||'#',featured:e.dataset.featured==='true',recommended:e.dataset.recommended==='true',id:e.dataset.id||i}))}
function makeCard(a){let el=document.createElement('article');el.className='card';let im=document.createElement('img');im.src=a.image||fallback;im.alt=a.title;im.loading='lazy';im.onerror=()=>im.src=fallback;let b=document.createElement('div');b.className='body';let tag=document.createElement('span');tag.className='tag';tag.textContent=a.category;let h=document.createElement('h3');h.textContent=a.title;let d=document.createElement('p');d.textContent=a.description;let actions=document.createElement('div');actions.className='actions';let link=document.createElement('a');link.href=a.link;link.target='_blank';link.rel='noopener';link.textContent='Ver anuncio';actions.append(link);if(WA_PHONE){let w=document.createElement('a');w.className='alt';w.href='https://wa.me/'+WA_PHONE+'?text='+encodeURIComponent('Hola, consulto por: '+a.title);w.target='_blank';w.textContent='WhatsApp';actions.append(w)}b.append(tag,h,d,actions);el.append(im,b);return el}
function render(items){let root=$('#content');root.replaceChildren();if(!items.length){let e=document.createElement('div');e.className='empty';e.textContent='No encontramos propagandas con esa búsqueda.';root.append(e);return}
let q=$('#q').value.trim(),c=$('#cat').value,groups;if(q||c)groups=[{name:'Resultados de búsqueda',items}];else{groups=[...new Set(items.map(a=>a.category))].map(name=>({name,items:items.filter(a=>a.category===name)}));let rec=items.filter(a=>a.recommended);if(rec.length)groups.unshift({name:'Productos recomendados',items:rec})}
groups.forEach((g,i)=>{if(!g.items.length)return;let sec=document.createElement('section');sec.className='section';let head=document.createElement('div');head.className='head';let h=document.createElement('h2');h.textContent=g.name;let count=document.createElement('small');count.textContent=g.items.length+' anuncios';let nav=document.createElement('div');nav.className='nav';let prev=document.createElement('button'),next=document.createElement('button');prev.textContent='‹';next.textContent='›';let rail=document.createElement('div');rail.className='rail';prev.onclick=()=>rail.scrollBy({left:-480,behavior:'smooth'});next.onclick=()=>rail.scrollBy({left:480,behavior:'smooth'});nav.append(prev,next);head.append(h,count,nav);g.items.forEach(a=>rail.append(makeCard(a)));if(!q&&!c&&g.items.length>2){let pause=false;rail.onmouseenter=()=>pause=true;rail.onmouseleave=()=>pause=false;rail.onfocusin=()=>pause=true;rail.onfocusout=()=>pause=false;let last=0;function move(t){if(!pause&&rail.isConnected&&t-last>28){rail.scrollLeft+=.45;last=t;if(rail.scrollLeft+rail.clientWidth>=rail.scrollWidth-2)rail.scrollLeft=0}if(rail.isConnected)requestAnimationFrame(move)}requestAnimationFrame(move)}sec.append(head,rail);root.append(sec)})}
function update(){let q=$('#q').value.toLowerCase().trim(),c=$('#cat').value;render(ads.filter(a=>(!c||a.category===c)&&(!q||[a.title,a.category,a.keywords,a.description].join(' ').toLowerCase().includes(q))))}
async function init(){try{let r=await fetch(SOURCE,{cache:'no-store'});if(!r.ok)throw Error();let doc=new DOMParser().parseFromString(await r.text(),'text/html');ads=parse(doc);[...new Set(ads.map(a=>a.category))].sort().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('#cat').append(o)});let f=ads.find(a=>a.featured);if(f){let hero=$('#hero');hero.replaceChildren();if(f.image){let im=document.createElement('img');im.src=f.image;im.alt=f.title;hero.append(im)}let box=document.createElement('div'),ey=document.createElement('div'),h=document.createElement('h1'),d=document.createElement('p'),a=document.createElement('a');box.className='hero-content';ey.className='eyebrow';ey.textContent='Banner destacado';h.textContent=f.title;d.textContent=f.description;a.href=f.link;a.target='_blank';a.rel='noopener';a.textContent='Conocer más';a.style='display:inline-block;margin-top:8px;padding:12px 18px;border-radius:10px;background:#35e7ff;color:#07101b;text-decoration:none;font-weight:bold';box.append(ey,h,d,a);hero.append(box)}render(ads)}catch(e){$('#content').innerHTML='<div class="empty">No se pudo cargar propagandas.html. Verificá que ambos archivos estén en la misma carpeta y publicados en el mismo sitio.</div>'}}
$('#q').addEventListener('input',update);$('#cat').addEventListener('change',update);init();
</script></body></html>
