<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gálvez Oscar | Buscador de propagandas</title>
<style>
:root{--bg:#080b18;--panel:#111a2d;--cyan:#35e7ff;--purple:#a879ff;--muted:#aab3ca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#17234a,transparent 38%),radial-gradient(ellipse at 90% 10%,#281342,transparent 32%),var(--bg);color:#f5f7ff;font-family:Arial,sans-serif}header{padding:25px 5vw 20px;border-bottom:1px solid #ffffff18;background:#080b18cc}.brand{font-size:clamp(25px,4vw,42px);font-weight:900}.brand span{color:var(--cyan);text-shadow:0 0 18px #35e7ff88}header p{color:var(--muted)}.search{display:flex;gap:10px;max-width:900px}input,select{background:#0b1020;color:white;border:1px solid #34415f;border-radius:12px;padding:14px;font-size:16px}#q{flex:1;min-width:0}.hero-wrap{margin:24px 5vw 30px}.hero-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.hero-head h2{margin:0;font-size:24px}.hero{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:4px 2px 16px;scrollbar-color:#45557c transparent}.hero-card{position:relative;flex:0 0 min(72vw,620px);height:260px;border:1px solid #4c5b83;border-radius:22px;overflow:hidden;background:linear-gradient(110deg,#121c38,#21133d 60%,#0b2635);cursor:pointer;box-shadow:0 15px 45px #0008}.hero-card:nth-child(3n+2){flex-basis:min(48vw,390px);height:220px;margin-top:20px}.hero-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}.hero-card:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#080b18e8,transparent)}.hero-copy{position:absolute;z-index:1;left:0;bottom:0;padding:25px;max-width:85%}.eyebrow,.tag{color:var(--cyan);font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;font-size:11px}.hero-copy h2{font-size:clamp(22px,3vw,34px);margin:8px 0}.hero-copy p{color:#d6def4;margin:0}.hero-arrow,.nav button{background:#111a2d;color:white;border:1px solid #34415f;border-radius:9px;padding:8px 13px;cursor:pointer}main{padding:0 5vw 50px}.section{margin:30px 0 38px}.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.head h2{font-size:clamp(20px,3vw,27px);margin:0;flex:1}.head h2:before{content:"";display:inline-block;width:5px;height:23px;border-radius:5px;background:var(--cyan);margin-right:11px;vertical-align:-4px;box-shadow:0 0 12px var(--cyan)}.head small{color:var(--muted)}.nav{display:flex;gap:7px}.rail{display:flex;gap:15px;overflow-x:auto;scroll-behavior:smooth;padding:4px 2px 15px;scrollbar-color:#45557c transparent}.card{flex:0 0 220px;background:linear-gradient(160deg,#151e34,#0c1120);border:1px solid #293754;border-radius:16px;overflow:hidden;box-shadow:0 8px 22px #0005;transition:.2s;cursor:pointer}.card:nth-child(4n+2){flex-basis:270px}.card:nth-child(5n){flex-basis:190px}.card:hover{transform:translateY(-5px);border-color:var(--cyan);box-shadow:0 10px 30px #35e7ff22}.card img{width:100%;height:145px;object-fit:cover;display:block;background:#1a2237}.card:nth-child(4n+2) img{height:170px}.body{padding:13px}.tag{letter-spacing:1px}.card h3{font-size:16px;margin:7px 0}.card p{font-size:13px;color:var(--muted);line-height:1.4;min-height:36px}.open-label{display:inline-block;margin-top:5px;color:var(--cyan);font-size:12px;font-weight:bold}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #42506d;border-radius:15px}.localities{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 22px}.localities button{background:#111a2d;color:#dce8ff;border:1px solid #34415f;border-radius:20px;padding:9px 14px;cursor:pointer}.localities button.active,.localities button:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px #35e7ff22}footer{text-align:center;color:#75809c;padding:25px;border-top:1px solid #ffffff12;font-size:12px}.modal{position:fixed;inset:0;z-index:1000;background:#02040bdc;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{position:relative;width:min(950px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#121d35,#090e1d);border:1px solid #35e7ff88;border-radius:22px;box-shadow:0 0 45px #35e7ff22,0 20px 70px #000b}.close{position:sticky;top:10px;float:right;margin:10px 10px 0 0;z-index:2;border:1px solid #526181;background:#0a1020;color:white;border-radius:50%;width:40px;height:40px;font-size:24px;cursor:pointer}.modal-cover{width:100%;max-height:340px;object-fit:cover;display:block;background:#151e34}.modal-content{padding:24px}.modal-content h2{font-size:clamp(24px,4vw,36px);margin:7px 0}.modal-content p{color:#d0d9ee;line-height:1.65;white-space:pre-wrap}.meta{color:#aab3ca;font-size:14px;margin:10px 0}.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.contact a{padding:12px 17px;border-radius:10px;text-decoration:none;color:#07101b;background:linear-gradient(90deg,var(--cyan),#8cddff);font-weight:bold}.contact a.fb,.contact a.site{background:#252f49;color:#e9efff;border:1px solid #3a496a}.modal-gallery{display:flex;gap:10px;overflow:auto;margin-top:16px}.modal-gallery img{height:110px;width:auto;max-width:220px;object-fit:cover;border-radius:10px;border:1px solid #34415f}@media(max-width:600px){header{padding:22px 4vw}.search{flex-direction:column}.hero-wrap{margin:18px 4vw 22px}.hero-card{flex-basis:88vw;height:220px}.hero-card:nth-child(3n+2){flex-basis:75vw;height:190px}.hero-copy{padding:18px}.hero-copy p{font-size:13px}main{padding:0 4vw 40px}.card{flex-basis:180px}.card:nth-child(4n+2){flex-basis:220px}.card img{height:125px}.modal{padding:8px}.modal-box{max-height:96vh}.modal-content{padding:18px}}
</style></head><body>
<header><div class="brand">GÁLVEZ <span>OSCAR</span> | PROPAGANDAS</div><p>Encontrá anuncios, productos y recomendaciones en un solo lugar.</p><div class="search"><input id="q" type="search" placeholder="Buscar productos, marcas, barrios o localidades..."><select id="cat"><option value="">Todos los rubros</option></select></div></header>
<section class="hero-wrap"><div class="hero-head"><h2>Destacados</h2><div><button class="hero-arrow" id="heroPrev">‹</button> <button class="hero-arrow" id="heroNext">›</button></div></div><div class="hero" id="hero"><div class="empty">Cargando destacados…</div></div></section>
<main><section class="section"><div class="head"><h2>Buscar por localidad</h2></div><div class="localities" id="localities"></div></section><div id="content"><div class="empty">Cargando propagandas…</div></div></main><footer>Gálvez Oscar · Buscador maestro de propagandas</footer>
<div class="modal" id="modal" aria-hidden="true"><div class="modal-box"><button class="close" id="closeModal" aria-label="Cerrar">×</button><div id="modalInner"></div></div></div>
<script>
const SOURCE='propagandas.html',WA_PHONE='';const $=s=>document.querySelector(s);let ads=[],activeLocation='';
const fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360"><rect width="100%" height="100%" fill="#18223a"/><text x="50%" y="50%" fill="#aab3ca" font-size="25" text-anchor="middle">Imagen no disponible</text></svg>');
function parse(doc){return [...doc.querySelectorAll('.ad-item')].map((e,i)=>({title:e.dataset.title||'Anuncio',category:e.dataset.category||'Otros',type:(e.dataset.type||'articulo').toLowerCase(),keywords:e.dataset.keywords||'',description:e.dataset.description||'',image:e.dataset.image||e.querySelector('img')?.getAttribute('src')||'',images:(e.dataset.images||'').split('|').filter(Boolean),link:e.dataset.link||'#',featured:e.dataset.featured==='true',recommended:e.dataset.recommended==='true',locality:e.dataset.locality||'',whatsapp:e.dataset.whatsapp||'',facebook:e.dataset.facebook||'',website:e.dataset.website||'',address:e.dataset.address||'',id:e.dataset.id||i}))}
function openAd(a){let inner=$('#modalInner');inner.replaceChildren();if(a.image){let im=document.createElement('img');im.className='modal-cover';im.src=a.image;im.onerror=()=>im.src=fallback;inner.append(im)}let box=document.createElement('div');box.className='modal-content';let tag=document.createElement('div');tag.className='tag';tag.textContent=a.category+' · '+a.type;let h=document.createElement('h2');h.textContent=a.title;let meta=document.createElement('div');meta.className='meta';meta.textContent=[a.locality,a.address].filter(Boolean).join(' · ');let desc=document.createElement('p');desc.textContent=a.description;let contacts=document.createElement('div');contacts.className='contact';function add(label,url,cls=''){if(!url)return;let l=document.createElement('a');l.textContent=label;l.href=url;l.target='_blank';l.rel='noopener';if(cls)l.className=cls;contacts.append(l)}let phone=(a.whatsapp||WA_PHONE).replace(/[^0-9]/g,'');let wa=phone?'https://wa.me/'+phone+'?text='+encodeURIComponent('Hola, consulto por: '+a.title):'';add('WhatsApp',wa);add('Facebook',a.facebook,'fb');add('Visitar sitio',a.website||a.link,'site');box.append(tag,h,meta,desc);if(a.images.length){let gal=document.createElement('div');gal.className='modal-gallery';a.images.forEach(src=>{let im=document.createElement('img');im.src=src;im.onerror=()=>im.remove();gal.append(im)});box.append(gal)}box.append(contacts);inner.append(box);$('#modal').classList.add('show');$('#modal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeAd(){ $('#modal').classList.remove('show');$('#modal').setAttribute('aria-hidden','true');document.body.style.overflow=''}$('#closeModal').onclick=closeAd;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeAd()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAd()});
function makeCard(a){let el=document.createElement('article');el.className='card';el.tabIndex=0;let im=document.createElement('img');im.src=a.image||fallback;im.alt=a.title;im.loading='lazy';im.onerror=()=>im.src=fallback;let b=document.createElement('div');b.className='body';let tag=document.createElement('span');tag.className='tag';tag.textContent=a.category;let h=document.createElement('h3');h.textContent=a.title;let d=document.createElement('p');d.textContent=a.description;let more=document.createElement('span');more.className='open-label';more.textContent='Ver información completa →';b.append(tag,h,d,more);el.append(im,b);el.onclick=()=>openAd(a);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openAd(a)}};return el}
function section(name,items,root,auto=true){if(!items.length)return;let sec=document.createElement('section');sec.className='section';let head=document.createElement('div');head.className='head';let h=document.createElement('h2');h.textContent=name;let count=document.createElement('small');count.textContent=items.length+' anuncios';let nav=document.createElement('div');nav.className='nav';let prev=document.createElement('button'),next=document.createElement('button');prev.textContent='‹';next.textContent='›';let rail=document.createElement('div');rail.className='rail';prev.onclick=()=>rail.scrollBy({left:-480,behavior:'smooth'});next.onclick=()=>rail.scrollBy({left:480,behavior:'smooth'});nav.append(prev,next);head.append(h,count,nav);items.forEach(a=>rail.append(makeCard(a)));if(auto&&items.length>2){let pause=false;rail.onmouseenter=()=>pause=true;rail.onmouseleave=()=>pause=false;rail.onfocusin=()=>pause=true;rail.onfocusout=()=>pause=false;let last=0;function move(t){if(!pause&&rail.isConnected&&t-last>28){rail.scrollLeft+=.45;last=t;if(rail.scrollLeft+rail.clientWidth>=rail.scrollWidth-2)rail.scrollLeft=0}if(rail.isConnected)requestAnimationFrame(move)}requestAnimationFrame(move)}sec.append(head,rail);root.append(sec)}
function render(items){let root=$('#content');root.replaceChildren();if(!items.length){let e=document.createElement('div');e.className='empty';e.textContent='No encontramos propagandas con esa búsqueda.';root.append(e);return}let q=$('#q').value.trim(),c=$('#cat').value;if(q||c||activeLocation){section('Resultados',items,root,false);return}section('Ofertas',items.filter(a=>a.type==='oferta'),root);section('Artículos',items.filter(a=>a.type==='articulo'),root);section('Servicios',items.filter(a=>a.type==='servicio'),root);section('Productos',items.filter(a=>a.type==='producto'||a.recommended),root)}
function update(){let q=$('#q').value.toLowerCase().trim(),c=$('#cat').value;render(ads.filter(a=>(!c||a.category===c)&&(!activeLocation||a.locality.toLowerCase()===activeLocation.toLowerCase())&&(!q||[a.title,a.category,a.keywords,a.description,a.locality,a.address].join(' ').toLowerCase().includes(q))))}
function buildLocations(){let loc=[...new Set(ads.map(a=>a.locality).filter(Boolean))].sort();let root=$('#localities');root.replaceChildren();let all=document.createElement('button');all.textContent='Todas las localidades';all.className=!activeLocation?'active':'';all.onclick=()=>{activeLocation='';buildLocations();update()};root.append(all);loc.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.className=activeLocation===x?'active':'';b.onclick=()=>{activeLocation=activeLocation===x?'':x;buildLocations();update()};root.append(b)})}
function buildHero(){let root=$('#hero');root.replaceChildren();let featured=ads.filter(a=>a.featured);if(!featured.length){root.innerHTML='<div class="empty">Todavía no hay banners destacados.</div>';return}featured.forEach(a=>{let el=document.createElement('article');el.className='hero-card';if(a.image){let im=document.createElement('img');im.src=a.image;im.alt=a.title;im.onerror=()=>im.src=fallback;el.append(im)}let copy=document.createElement('div');copy.className='hero-copy';let tag=document.createElement('div');tag.className='eyebrow';tag.textContent='Destacado';let h=document.createElement('h2');h.textContent=a.title;let d=document.createElement('p');d.textContent=a.description;copy.append(tag,h,d);el.append(copy);el.onclick=()=>openAd(a);root.append(el)});let paused=false;root.onmouseenter=()=>paused=true;root.onmouseleave=()=>paused=false;let last=0;function tick(t){if(!paused&&root.isConnected&&root.scrollWidth>root.clientWidth&&t-last>25){root.scrollLeft+=.6;last=t;if(root.scrollLeft+root.clientWidth>=root.scrollWidth-2)root.scrollLeft=0}if(root.isConnected)requestAnimationFrame(tick)}requestAnimationFrame(tick)}
$('#heroPrev').onclick=()=>$('#hero').scrollBy({left:-500,behavior:'smooth'});$('#heroNext').onclick=()=>$('#hero').scrollBy({left:500,behavior:'smooth'});
async function init(){try{let r=await fetch(SOURCE,{cache:'no-store'});if(!r.ok)throw Error();let doc=new DOMParser().parseFromString(await r.text(),'text/html');ads=parse(doc);[...new Set(ads.map(a=>a.category))].sort().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('#cat').append(o)});buildHero();buildLocations();render(ads)}catch(e){$('#content').innerHTML='<div class="empty">No se pudo cargar propagandas.html. Verificá que ambos archivos estén en la misma carpeta y publicados en el mismo sitio.</div>'}}
$('#q').addEventListener('input',update);$('#cat').addEventListener('change',update);init();
</script></body></html>
