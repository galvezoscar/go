<script>
(function() {
    'use strict';

    // Pixel transparente 1x1 como placeholder
    var PIXEL = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

    // ==========================================
    // 1. INTERCEPTAR: guardar src real en data-src, poner placeholder
    // ==========================================
    function interceptar(img) {
        if (img.getAttribute('data-lz') === '1') return; // ya interceptada
        var src = img.getAttribute('src');
        if (!src || src.startsWith('data:')) return; // no interceptar data-uris
        
        img.setAttribute('data-src', src);   // guardar la url real
        img.setAttribute('src', PIXEL);       // poner placeholder
        img.setAttribute('data-lz', '1');     // marcar como interceptada
        img.style.opacity = '0';
        img.style.transition = 'opacity 0.5s ease';
    }

    // ==========================================
    // 2. CARGAR: restaurar src real cuando toque
    // ==========================================
    function cargar(img) {
        var realSrc = img.getAttribute('data-src');
        if (!realSrc) return;
        
        img.setAttribute('src', realSrc);
        img.removeAttribute('data-src');
        
        // Fade-in cuando termine de descargar
        img.onload = function() {
            img.style.opacity = '1';
            img.onload = null;
        };
        img.onerror = function() {
            img.style.opacity = '1';
            img.style.background = '#2a0a0a';
            img.onerror = null;
        };

        // Si ya estaba en cache, onload no dispara
        if (img.complete) {
            img.style.opacity = '1';
        }
    }

    // ==========================================
    // 3. INTERSECTION OBSERVER: carga al entrar al viewport
    // ==========================================
    var io = new IntersectionObserver(function(entries) {
        for (var i = 0; i < entries.length; i++) {
            if (entries[i].isIntersecting) {
                cargar(entries[i].target);
                io.unobserve(entries[i].target);
            }
        }
    }, {
        rootMargin: '300px 0px', // empezar a cargar 300px antes de verse
        threshold: 0.01
    });

    // ==========================================
    // 4. MUTATION OBSERVER: atrapar imágenes nuevas Y cambios display
    // ==========================================
    var mo = new MutationObserver(function(mutations) {
        for (var m = 0; m < mutations.length; m++) {
            var mut = mutations[m];

            // --- Imágenes nuevas inyectadas al DOM ---
            if (mut.addedNodes) {
                for (var n = 0; n < mut.addedNodes.length; n++) {
                    var nodo = mut.addedNodes[n];
                    if (nodo.nodeName === 'IMG') {
                        interceptar(nodo);
                        io.observe(nodo);
                    }
                    if (nodo.querySelectorAll) {
                        var imgs = nodo.querySelectorAll('img');
                        for (var j = 0; j < imgs.length; j++) {
                            interceptar(imgs[j]);
                            io.observe(imgs[j]);
                        }
                    }
                }
            }

            // --- Un contenedor pasó de display:none a visible ---
            if (mut.type === 'attributes' && mut.attributeName === 'style') {
                var target = mut.target;
                var displayActual = window.getComputedStyle(target).display;
                if (displayActual !== 'none') {
                    var internas = target.querySelectorAll('img[data-src]');
                    for (var k = 0; k < internas.length; k++) {
                        cargar(internas[k]);
                        io.unobserve(internas[k]);
                    }
                }
            }
        }
    });

    // ==========================================
    // 5. INICIO: interceptar todo lo que ya existe
    // ==========================================
    var todas = document.querySelectorAll('img');
    var contador = 0;
    for (var i = 0; i < todas.length; i++) {
        interceptar(todas[i]);
        io.observe(todas[i]);
        contador++;
    }

    // Activar vigilancia permanente
    mo.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['style']
    });

    // ==========================================
    // 6. RE-ESCANEO cada 2 segundos (seguridad extra)
    //    Atrapa imágenes que se escaparon por plugins o scripts externos
    // ==========================================
    setInterval(function() {
        var pendientes = document.querySelectorAll('img:not([data-lz])');
        for (var i = 0; i < pendientes.length; i++) {
            var src = pendientes[i].getAttribute('src');
            if (src && !src.startsWith('data:')) {
                interceptar(pendientes[i]);
                io.observe(pendientes[i]);
            }
        }
    }, 2000);

    console.log('Carga dinamica REAL activada: ' + contador + ' imagen(es) interceptadas');
})();

    if (trailer.classList.contains("active")) {

        // 2. ENTRAR EN PANTALLA COMPLETA
        var elem = document.documentElement; 
        
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari */
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
            elem.msRequestFullscreen();
        }

    } else {
        // Si el popup se desactivó (se cerró)
        
        // 1. Volvemos a mostrar el buscador para que puedas buscar otra película
        if(buscadorInput) buscadorInput.style.display = 'block';

    <script>
    (function() {
        // 1. Detectar si es móvil (Android) o PC
        var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        // --- 2. LÓGICA PARA PC (PRIMER TOQUE Y MORIR) ---
        if (!isTouchDevice) {
            let pcClickDone = false;

            function handlePcClick() {
                if (pcClickDone) return;

                var elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();

                pcClickDone = true;
                
                // AQUÍ ELIMINAMOS LA FUNCIÓN EN PC
                document.body.removeEventListener('click', handlePcClick);
                console.log("PC: Fullscreen activo, función detenida.");
            }
            document.body.addEventListener('click', handlePcClick);
        } 

        // --- 3. LÓGICA PARA ANDROID (DESLIZAR SIEMPRE ACTIVO) ---
        else {
            let touchStartY = 0;
            const swipeThreshold = 50; // Píxeles mínimos para que cuente como deslizamiento

            function handleTouchStart(e) {
                touchStartY = e.touches[0].clientY;
            }

            function handleTouchEnd(e) {
                var touchEndY = e.changedTouches[0].clientY;
                var diffY = touchStartY - touchEndY; 
                // Positivo = Arriba (Dedido sube), Negativo = Abajo (Dedo baja)

                var elem = document.documentElement;

                // DESLIZAR ARRIBA (Abrir pantalla completa)
                if (diffY > swipeThreshold) {
                    if (elem.requestFullscreen) elem.requestFullscreen();
                    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                }
                
                // DESLIZAR ABAJO (Salir de pantalla completa)
                else if (diffY < -swipeThreshold) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    else if (document.msExitFullscreen) document.msExitFullscreen();
                }
            }

            // AGREGAMOS LISTENERS PARA ANDROID
            // NOTA: NO hay "removeEventListener" aquí, por lo que SIGUE FUNCIONANDO SIEMPRE.
            document.body.addEventListener('touchstart', handleTouchStart, {passive: true});
            document.body.addEventListener('touchend', handleTouchEnd, {passive: true});
            
            console.log("Android: Gestos de deslizar activados permanentemente.");
        }
    })();
</script>

<script>
(function(){
    var buscador = document.getElementById('buscadorPeliculas');
    var resultadoTexto = document.getElementById('resultadoBusqueda');
    var controles = document.getElementById('buscadorControles');
    var contadorSpan = document.getElementById('contadorResultados');
    var btnAnterior = document.getElementById('btnAnterior');
    var btnSiguiente = document.getElementById('btnSiguiente');
    
    // Variables para el slider de resultados
    var listaResultados = []; // Array que guarda los elementos encontrados
    var indiceActual = 0;     // Posición actual en el array

    // Función para mostrar un resultado específico
    function mostrarResultadoEnIndice(index) {
        // Ocultar todos los slides buscables primero
        var slidesBuscables = document.querySelectorAll('.slides[data-buscable="si"]');
        slidesBuscables.forEach(function(slide){
            slide.style.display = 'none';
        });

        // Mostrar solo el que corresponde al índice
        if (listaResultados.length > 0) {
            listaResultados[index].style.display = 'block';
            // Actualizar contador (ej: 1 / 5)
            contadorSpan.textContent = (index + 1) + ' / ' + listaResultados.length;
        }
    }

    // Evento Input (Escribir en el buscador)
    buscador.addEventListener('input', function(){
        var texto = this.value.toLowerCase().trim();
        listaResultados = []; // Reiniciar lista
        indiceActual = 0;

        // Si está vacío, limpiar todo
        if(texto === ''){
            document.querySelectorAll('.slides[data-buscable="si"]').forEach(function(slide){
                slide.style.display = 'none';
            });
            resultadoTexto.style.display = 'none';
            controles.style.display = 'none';
            return;
        }

        // Buscar coincidencias
        var slidesBuscables = document.querySelectorAll('.slides[data-buscable="si"]');
        slidesBuscables.forEach(function(slide){
            var nombre = (slide.getAttribute('data-nombre') || '').toLowerCase();
            var desc = (slide.querySelector('.description') || {}).textContent || '';
            desc = desc.toLowerCase();
            var generos = '';
            slide.querySelectorAll('.link').forEach(function(l){ generos += ' ' + l.textContent; });
            generos = generos.toLowerCase();
            
            // Si coincide, agregar a la lista (no mostrar todavía)
            if(nombre.indexOf(texto) !== -1 || desc.indexOf(texto) !== -1 || generos.indexOf(texto) !== -1){
                listaResultados.push(slide);
            } else {
                slide.style.display = 'none';
            }
        });

        // Mostrar resultados
        if(listaResultados.length > 0){
            resultadoTexto.style.display = 'block';
            resultadoTexto.textContent = listaResultados.length + ' resultado(s)';
            
            // Mostrar controles y primer resultado
            controles.style.display = 'flex';
            mostrarResultadoEnIndice(0);
        } else {
            resultadoTexto.style.display = 'block';
            resultadoTexto.textContent = 'No se encontraron resultados';
            controles.style.display = 'none';
        }
    });

    // Botón Siguiente
    btnSiguiente.addEventListener('click', function(){
        if(listaResultados.length === 0) return;
        
        // Ocultar el actual
        listaResultados[indiceActual].style.display = 'none';
        
        // Avanzar índice (si llega al final, vuelve al principio)
        indiceActual++;
        if(indiceActual >= listaResultados.length){
            indiceActual = 0;
        }
        
        // Mostrar el nuevo
        mostrarResultadoEnIndice(indiceActual);
    });

    // Botón Anterior
    btnAnterior.addEventListener('click', function(){
        if(listaResultados.length === 0) return;
        
        listaResultados[indiceActual].style.display = 'none';
        
        // Retroceder índice (si llega al inicio, va al final)
        indiceActual--;
        if(indiceActual < 0){
            indiceActual = listaResultados.length - 1;
        }
        
        mostrarResultadoEnIndice(indiceActual);
    });
    
    // Limpiar con Escape
    buscador.addEventListener('keydown', function(e){
        if(e.key === 'Escape'){
            this.value = '';
            this.dispatchEvent(new Event('input'));
            this.blur();
        }
    });
})();
</script>

     <script>

        const iframe = document.getElementById('videoOk');
        let sonidoActivado = false;

        // Función para cambiar el estado de mute a unmute
        function activarAudio() {
            if (!sonidoActivado) {
                // Reemplazamos muted=1 por muted=0 en la URL
                const urlActual = iframe.src;
                const urlNueva = urlActual.replace('muted=1', 'muted=0');
                
                iframe.src = urlNueva; // Recargamos el iframe con audio
                sonidoActivado = true;
                console.log("Sonido activado");
            }
        }

        // Escuchamos el primer clic en toda la página
        document.addEventListener('click', function() {
            activarAudio();
        });

    <script>
    // --- BLOQUEO TOTAL DE INTERACCIÓN ---

    // 1. BLOQUEAR CLIC DERECHO (Menú Contextual)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });

    // 2. BLOQUEAR TECLAS (Desarrollador, Guardar, Copiar, Imprimir)
    document.addEventListener('keydown', function(e) {
        // Lista de teclas prohibidas
        if (
            e.key === 'F12' ||                        // Consola
            (e.ctrlKey && e.key === 'u') ||           // Ver código fuente
            (e.ctrlKey && e.key === 's') ||           // Guardar
            (e.ctrlKey && e.key === 'c') ||           // Copiar
            (e.ctrlKey && e.key === 'p') ||           // Imprimir
            (e.ctrlKey && e.shiftKey && e.key === 'I')// Inspeccionar (Chrome)
        ) {
            e.preventDefault();
            alert("Acción deshabilitada"); // Opcional: mensaje de alerta
            return false;
        }
    });

    // 3. BLOQUEAR ZOOM CON RUEDA DEL RATÓN (Ctrl + Scroll)
    document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
            e.preventDefault();
            return false;
        }
    }, { passive: false });

    // 4. EVITAR DOBLE TAP ZOOM EN MÓVIL (Refuerzo)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        var now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

</script>
