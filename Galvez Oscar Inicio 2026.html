    (function() {
        // 1. Detectar si es móvil (Android) o PC
        var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        // --- 2. LÓGICA PARA PC (PRIMER TOQUE Y MORIR) ---
        if (!isTouchDevice) {
            let pcClickDone = false;

            function handlePcClick() {
                if (pcClickDone) return;

                var elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();

                pcClickDone = true;
                
                // AQUÍ ELIMINAMOS LA FUNCIÓN EN PC
                document.body.removeEventListener('click', handlePcClick);
                console.log("PC: Fullscreen activo, función detenida.");
            }
            document.body.addEventListener('click', handlePcClick);
        } 

        // --- 3. LÓGICA PARA ANDROID (DESLIZAR SIEMPRE ACTIVO) ---
        else {
            let touchStartY = 0;
            const swipeThreshold = 50; // Píxeles mínimos para que cuente como deslizamiento

            function handleTouchStart(e) {
                touchStartY = e.touches[0].clientY;
            }

            function handleTouchEnd(e) {
                var touchEndY = e.changedTouches[0].clientY;
                var diffY = touchStartY - touchEndY; 
                // Positivo = Arriba (Dedido sube), Negativo = Abajo (Dedo baja)

                var elem = document.documentElement;

                // DESLIZAR ARRIBA (Abrir pantalla completa)
                if (diffY > swipeThreshold) {
                    if (elem.requestFullscreen) elem.requestFullscreen();
                    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                }
                
                // DESLIZAR ABAJO (Salir de pantalla completa)
                else if (diffY < -swipeThreshold) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    else if (document.msExitFullscreen) document.msExitFullscreen();
                }
            }

            // AGREGAMOS LISTENERS PARA ANDROID
            // NOTA: NO hay "removeEventListener" aquí, por lo que SIGUE FUNCIONANDO SIEMPRE.
            document.body.addEventListener('touchstart', handleTouchStart, {passive: true});

    function mostrarResultadoEnIndice(index) {
        // Ocultar todos los slides buscables primero
        var slidesBuscables = document.querySelectorAll('.slides[data-buscable="si"]');
        slidesBuscables.forEach(function(slide){
            slide.style.display = 'none';
        });

        // Mostrar solo el que corresponde al índice
        if (listaResultados.length > 0) {
            listaResultados[index].style.display = 'block';
            // Actualizar contador (ej: 1 / 5)
            contadorSpan.textContent = (index + 1) + ' / ' + listaResultados.length;
        }
    }

    // Evento Input (Escribir en el buscador)
    buscador.addEventListener('input', function(){
        var texto = this.value.toLowerCase().trim();
        listaResultados = []; // Reiniciar lista
        indiceActual = 0;

        // Si está vacío, limpiar todo
        if(texto === ''){
            document.querySelectorAll('.slides[data-buscable="si"]').forEach(function(slide){
                slide.style.display = 'none';
            });
            resultadoTexto.style.display = 'none';
            controles.style.display = 'none';
            return;
        }

        // Buscar coincidencias
        var slidesBuscables = document.querySelectorAll('.slides[data-buscable="si"]');
        slidesBuscables.forEach(function(slide){
            var nombre = (slide.getAttribute('data-nombre') || '').toLowerCase();
            var desc = (slide.querySelector('.description') || {}).textContent || '';
            desc = desc.toLowerCase();
            var generos = '';
            slide.querySelectorAll('.link').forEach(function(l){ generos += ' ' + l.textContent; });
            generos = generos.toLowerCase();
            
            // Si coincide, agregar a la lista (no mostrar todavía)
            if(nombre.indexOf(texto) !== -1 || desc.indexOf(texto) !== -1 || generos.indexOf(texto) !== -1){
                listaResultados.push(slide);
            } else {
                slide.style.display = 'none';
            }
        });

        // Mostrar resultados
        if(listaResultados.length > 0){
            resultadoTexto.style.display = 'block';
            resultadoTexto.textContent = listaResultados.length + ' resultado(s)';
            
            // Mostrar controles y primer resultado
            controles.style.display = 'flex';
            mostrarResultadoEnIndice(0);
        } else {
            resultadoTexto.style.display = 'block';
            resultadoTexto.textContent = 'No se encontraron resultados';
            controles.style.display = 'none';
        }
    });

    // Botón Siguiente
    btnSiguiente.addEventListener('click', function(){
        if(listaResultados.length === 0) return;
        
        // Ocultar el actual
        listaResultados[indiceActual].style.display = 'none';
        
        // Avanzar índice (si llega al final, vuelve al principio)
        indiceActual++;
        if(indiceActual >= listaResultados.length){
            indiceActual = 0;
        }
        
        // Mostrar el nuevo
        mostrarResultadoEnIndice(indiceActual);
    });

        listaResultados[indiceActual].style.display = 'none';
        
        // Retroceder índice (si llega al inicio, va al final)
        indiceActual--;
        if(indiceActual < 0){
            indiceActual = listaResultados.length - 1;
        }
        
        mostrarResultadoEnIndice(indiceActual);
    });
    
    // Limpiar con Escape
    buscador.addEventListener('keydown', function(e){
        if(e.key === 'Escape'){
            this.value = '';
            this.dispatchEvent(new Event('input'));
            this.blur();
        }
    });
})();

    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });

    // 2. BLOQUEAR TECLAS (Desarrollador, Guardar, Copiar, Imprimir)
    document.addEventListener('keydown', function(e) {
        // Lista de teclas prohibidas
        if (
            e.key === 'F12' ||                        // Consola
            (e.ctrlKey && e.key === 'u') ||           // Ver código fuente
            (e.ctrlKey && e.key === 's') ||           // Guardar
            (e.ctrlKey && e.key === 'c') ||           // Copiar
            (e.ctrlKey && e.key === 'p') ||           // Imprimir
            (e.ctrlKey && e.shiftKey && e.key === 'I')// Inspeccionar (Chrome)
        ) {
            e.preventDefault();
            alert("Acción deshabilitada"); // Opcional: mensaje de alerta
            return false;
        }
    });

    // 3. BLOQUEAR ZOOM CON RUEDA DEL RATÓN (Ctrl + Scroll)
    document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
            e.preventDefault();
            return false;
        }
    }, { passive: false });

    // 4. EVITAR DOBLE TAP ZOOM EN MÓVIL (Refuerzo)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        var now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

</script>

<script id="galvez-info-2026-script">
(function(){
  'use strict';
  var peliculaActual = null;
  function texto(el){ return el ? (el.textContent || '').replace(/\s+/g,' ').trim() : ''; }
  function normalizarGeneros(valor){ return (valor || '').replace(/C\s*ficcion/ig,'Ciencia ficción').replace(/C\s*ficción/ig,'Ciencia ficción').replace(/Romantica/ig,'Romántica').replace(/Accion/ig,'Acción').replace(/Aventuras/ig,'Aventura').replace(/Thriller Acción n/ig,'Thriller, Acción').trim(); }
  function registrarPeliculaDesde(elemento){
    var slide = elemento && elemento.closest ? elemento.closest('.slides') : null;
    if(!slide) return;
    var imagen = slide.querySelector('.logopeli');
    var titulo = '';
    if (imagen) {
      var ruta = imagen.getAttribute('src') || '';
      ruta = ruta.split('/').pop().split('\\').pop();
      try { ruta = decodeURIComponent(ruta); } catch(e) {}
      titulo = ruta.replace(/\.(gif|jpe?g|png|webp)$/i, '').replace(/\s+/g, ' ').trim();
      titulo = titulo.replace(/\s*\(\d{4}\)\s*$/,'').trim();
    }
    if (!titulo) titulo = (slide.getAttribute('data-nombre') || '').trim()
      .replace(/\s+(Comedia|Romantica|Romántica|Animacion|Animación|Aventura|Accion|Acción|Terror|Thriller|Drama|Familia|Deporte|Reboot|C ficcion|Ciencia ficcion)\b/ig, '')
      .replace(/\s+20\d{2}\s*$/,'').trim();
    peliculaActual = {
      titulo: titulo || (slide.getAttribute('data-nombre') || 'Información').trim(),
      descripcion: texto(slide.querySelector('.description')),
      anio: texto(slide.querySelector('.año, .ano, .year')),
      generos: normalizarGeneros(texto(slide.querySelector('.genero')))
    };
    document.querySelectorAll('.galvez-info-panel-2026').forEach(renderizarPanel);
  }
  function ajustarContenido(panel){
    var desc = panel.querySelector('.galvez-info-description-2026');
    if(!desc) return;
    desc.style.fontSize = '';
    var size = parseFloat(getComputedStyle(desc).fontSize) || 14;
    var intentos = 0;
    while(panel.scrollHeight > panel.clientHeight && size > 9 && intentos < 12){
      size -= 0.5; desc.style.fontSize = size + 'px'; intentos++;
    }
  }
  function renderizarPanel(panel){
    var p = peliculaActual || {titulo:'Información', descripcion:'Seleccioná un título y abrí el video con GO.', anio:'', generos:''};
    panel.querySelector('.galvez-info-title-2026').textContent = p.titulo || 'Información';
    panel.querySelector('.galvez-info-description-2026').textContent = p.descripcion || 'No hay descripción disponible.';
    panel.querySelector('.galvez-info-year-2026').textContent = p.anio ? 'Año: ' + p.anio : '';
    panel.querySelector('.galvez-info-genres-2026').textContent = p.generos ? 'Género: ' + p.generos : '';
    requestAnimationFrame(function(){ ajustarContenido(panel); });
  }
  function instalar(){
    document.addEventListener('click', function(ev){
      var go = ev.target && ev.target.closest ? ev.target.closest('.go, a.red20') : null;
      if(!go) return;
      var slide = go.closest('.slides');
      if(slide) registrarPeliculaDesde(slide);
    }, true);
    document.querySelectorAll('.fullvid').forEach(function(zona){
      if(zona.querySelector('.galvez-info-hotspot-2026')) return;
      var hotspot = document.createElement('div');
      hotspot.className = 'galvez-info-hotspot-2026';
      hotspot.setAttribute('role','note');
      hotspot.setAttribute('aria-label','Pasá o apoyá el dedo aquí para ver la información');
      hotspot.innerHTML = '<span aria-hidden="true">ⓘ</span><span>Info</span>';
      var panel = document.createElement('div');
      panel.className = 'galvez-info-panel-2026';
      panel.setAttribute('aria-label','Información');
      panel.innerHTML = '<h3 class="galvez-info-title-2026">Información</h3><p class="galvez-info-year-2026"></p><p class="galvez-info-genres-2026"></p><p class="galvez-info-description-2026">Seleccioná un título y abrí el video con GO.</p>';
      hotspot.addEventListener('touchstart', function(){ hotspot.classList.add('touch-active'); panel.classList.add('is-visible'); renderizarPanel(panel); }, {passive:true});
      function ocultarTouch(){ hotspot.classList.remove('touch-active'); panel.classList.remove('is-visible'); }
      hotspot.addEventListener('touchend', ocultarTouch, {passive:true});
      hotspot.addEventListener('touchcancel', ocultarTouch, {passive:true});
      zona.appendChild(hotspot); zona.appendChild(panel);
      // En PC, la información se muestra cuando hay movimiento del mouse y se oculta tras 2,5 s de inactividad.
      var temporizadorInactividad = null;
      function mostrarPorMovimiento(){
        if(!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
        zona.classList.add('info-mouse-active-2026');
        if(temporizadorInactividad) window.clearTimeout(temporizadorInactividad);
        temporizadorInactividad = window.setTimeout(function(){
          zona.classList.remove('info-mouse-active-2026');
        }, 2500);
      }
      zona.addEventListener('mousemove', mostrarPorMovimiento, {passive:true});
      zona.addEventListener('pointermove', mostrarPorMovimiento, {passive:true});
      zona.addEventListener('mouseleave', function(){
        zona.classList.remove('info-mouse-active-2026');
        if(temporizadorInactividad) window.clearTimeout(temporizadorInactividad);
      }, {passive:true});
      renderizarPanel(panel);
    });
    window.addEventListener('resize', function(){ document.querySelectorAll('.galvez-info-panel-2026').forEach(ajustarContenido); });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', instalar); else instalar();
})();
</script>
