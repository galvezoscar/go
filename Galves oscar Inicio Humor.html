<script>
function pantallaCompleta(){
    var elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.mozRequestFullScreen) {     /* Firefox */
        elem.mozRequestFullScreen();
    } else if (elem.webkitRequestFullscreen) {  /* Chrome, Edge */
        elem.webkitRequestFullscreen();
    }
}

/* Detecta cuando ENTRA o SALE de pantalla completa */
function alCambiarFullscreen(){
    var btn = document.getElementById('btnFull');
    var iframe = document.querySelector('#nuevaimg iframe');
    var enFull = document.fullscreenElement || document.webkitFullscreenElement;

    if (enFull) {
        /* Está en pantalla completa -> OCULTAR botón */
        btn.style.display = 'none';
    } else if (iframe) {
        /* Salió de pantalla completa y hay video -> MOSTRAR botón */
        btn.style.display = 'block';
    }
}

document.addEventListener('fullscreenchange', alCambiarFullscreen);
document.addEventListener('webkitfullscreenchange', alCambiarFullscreen);

/* Al volver a la pestaña, mostrar botón si no está en fullscreen */
document.addEventListener('visibilitychange', function(){
    if (!document.hidden) {
        var iframe = document.querySelector('#nuevaimg iframe');
        var enFull = document.fullscreenElement;
        if (iframe && !enFull) {
            document.getElementById('btnFull').style.display = 'block';
        }
    }
});
</script>
