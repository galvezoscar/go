<script>
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const targetImg = params.get('img');

    if (targetImg) {
      // Busca todas las secciones de películas en el carrusel
      const slides = document.querySelectorAll('.slides');
      
      slides.forEach(slide => {
        const img = slide.querySelector('img');
        if (img && img.getAttribute('src').includes(targetImg)) {
          // 1. Muestra el slide de la película quitando el display: none
          slide.style.display = 'block';
          
          // 2. Desplaza la pantalla suavemente hacia la película
          slide.scrollIntoView({ behavior: 'smooth', block: 'center' });

          // 3. Busca el botón "go" y extrae su función de video (ej: mostrar0003())
          setTimeout(() => {
            const goBtn = slide.querySelector('.go, button.go, a.go');
            if (goBtn) {
              const onclickAttr = goBtn.getAttribute('onclick');
              if (onclickAttr) {
                // Ejecuta la función original que inyecta el iframe del video
                eval(onclickAttr);
              } else {
                goBtn.click();
              }
            }
          }, 300);
        }
      });
    }
  });
</script>
