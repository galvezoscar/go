<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador General de Películas</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      padding: 20px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 15px;
    }

    input, select {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"] {
      flex: 1 1 280px;
      max-width: 450px;
    }

    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 1000px;
      margin: 0 auto 20px auto;
    }

    .btn-quick {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-quick:hover, .btn-quick.active {
      background-color: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      font-weight: bold;
    }

    .stats {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    section {
      background-color: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      position: relative;
      transition: transform 0.2s;
    }

    section:hover {
      transform: translateY(-4px);
    }

    section img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
      background-color: #0f172a;
      cursor: pointer;
    }

    section p {
      padding: 12px 16px;
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.4;
      flex-grow: 1;
      margin: 0;
      text-transform: capitalize;
      font-weight: 600;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #94a3b8;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Buscador General de Películas</h1>
    
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Buscar película por nombre...">
      <select id="yearFilter">
        <option value="">Todos los Años (2026 - 2019)</option>
      </select>
    </div>

    <div class="quick-buttons" id="yearButtons">
      <button class="btn-quick active" onclick="setYearQuick('')">Todos</button>
      <button class="btn-quick" onclick="setYearQuick('2026')">2026</button>
      <button class="btn-quick" onclick="setYearQuick('2025')">2025</button>
      <button class="btn-quick" onclick="setYearQuick('2024')">2024</button>
      <button class="btn-quick" onclick="setYearQuick('2023')">2023</button>
      <button class="btn-quick" onclick="setYearQuick('2022')">2022</button>
      <button class="btn-quick" onclick="setYearQuick('2021')">2021</button>
      <button class="btn-quick" onclick="setYearQuick('2020')">2020</button>
      <button class="btn-quick" onclick="setYearQuick('2019')">2019</button>
    </div>

    <div class="stats" id="statsCount">Cargando catálogo desde el servidor...</div>
  </header>

  <main class="grid" id="moviesGrid"></main>

  <script>
    const baseUrl = "https://galvezoscar.github.io/go/";

    const pageUrls = [
      "Galvez%20Oscar%20Inicio%202026.html",
      "Galvez%20Oscar%20Inicio%202025.html",
      "Galvez%20Oscar%20Inicio%202024.html",
      "Galvez%20Oscar%20Inicio%202023.html",
      "Galvez%20Oscar%20Inicio%202022.html",
      "Galvez%20Oscar%20Inicio%202021.html",
      "Galvez%20Oscar%20Inicio%202020.html",
      "Galvez%20Oscar%20Inicio%202019.html",
      "Galvez%20Oscar%20Animacion%202026.html",
      "Galvez%20Oscar%20Animacion%202025.html",
      "Galvez%20Oscar%20Animacion%202024.html",
      "Galvez%20Oscar%20Animacion%202023.html",
      "Galvez%20Oscar%20Animacion%202022.html",
      "Galvez%20Oscar%20Animacion%202021.html",
      "Galvez%20Oscar%20Animacion%202020.html",
      "Galvez%20Oscar%20Animacion%202019.html"
    ];

    let allMovies = [];
    const moviesGrid = document.getElementById('moviesGrid');
    const searchInput = document.getElementById('searchInput');
    const yearFilter = document.getElementById('yearFilter');
    const statsCount = document.getElementById('statsCount');

    async function fetchAllMovies() {
      const parser = new DOMParser();
      const uniqueTitles = new Set();

      for (const pageUrl of pageUrls) {
        try {
          const res = await fetch(baseUrl + pageUrl);
          if (!res.ok) continue;
          const text = await res.text();
          const doc = parser.parseFromString(text, 'text/html');

          const images = doc.querySelectorAll('cam img, .z-slide-item img, .item img');
          
          images.forEach(img => {
            const imgSrc = img.getAttribute('src');
            if (!imgSrc) return;

            const fileName = imgSrc.split('/').pop();
            const cleanTitle = decodeURIComponent(fileName)
              .replace(/\.(jpg|jpeg|png|gif|webp)/i, '')
              .replace(/%20/g, ' ')
              .trim();

            const yearMatch = pageUrl.match(/\b(2019|2020|2021|2022|2023|2024|2025|2026)\b/);
            const year = yearMatch ? yearMatch[0] : '';

            // Vincula directamente pasando el nombre de la película para que el script abra el carrusel y el video
            const targetPageUrl = `${baseUrl}${pageUrl}?pelicula=${encodeURIComponent(cleanTitle)}`;

            if (!uniqueTitles.has(cleanTitle) && cleanTitle) {
              uniqueTitles.add(cleanTitle);
              allMovies.push({
                title: cleanTitle,
                year: year,
                imgSrc: imgSrc,
                targetPageUrl: targetPageUrl
              });
            }
          });
        } catch (e) {
          console.error("Error al cargar " + pageUrl, e);
        }
      }

      initFilters();
      renderMovies(allMovies);
    }

    function initFilters() {
      const years = new Set();
      allMovies.forEach(m => {
        if (m.year && /^\d{4}$/.test(m.year)) years.add(m.year);
      });

      Array.from(years).sort().reverse().forEach(y => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        yearFilter.appendChild(opt);
      });
    }

    function renderMovies(data) {
      moviesGrid.innerHTML = '';
      statsCount.textContent = `Mostrando ${data.length} de ${allMovies.length} películas en total`;

      if (data.length === 0) {
        moviesGrid.innerHTML = '<div class="no-results">No se encontraron películas.</div>';
        return;
      }

      data.forEach(m => {
        const section = document.createElement('section');

        let cleanImgSrc = m.imgSrc.startsWith('./') ? m.imgSrc.substring(2) : m.imgSrc;
        const fullImgUrl = cleanImgSrc.startsWith('http') ? cleanImgSrc : baseUrl + cleanImgSrc;

        section.innerHTML = `
          <a href="${m.targetPageUrl}">
            <img src="${fullImgUrl}" alt="${m.title}" loading="lazy" decoding="async">
          </a>
          <p>${m.title} ${m.year ? `(${m.year})` : ''}</p>
        `;
        moviesGrid.appendChild(section);
      });
    }

    function filterMovies() {
      const query = searchInput.value.toLowerCase();
      const selectedYear = yearFilter.value;

      const filtered = allMovies.filter(m => {
        const matchesQuery = m.title.toLowerCase().includes(query);
        const matchesYear = selectedYear === '' || m.year === selectedYear;
        return matchesQuery && matchesYear;
      });

      renderMovies(filtered);
    }

    function setYearQuick(year) {
      yearFilter.value = year;
      const buttons = document.querySelectorAll('#yearButtons .btn-quick');
      buttons.forEach(btn => {
        if ((year === '' && btn.textContent === 'Todos') || btn.textContent === year) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      filterMovies();
    }

    searchInput.addEventListener('input', filterMovies);
    yearFilter.addEventListener('change', () => setYearQuick(yearFilter.value));

    fetchAllMovies();
  </script>
</body>
</html>
